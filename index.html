<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>25 Words or Less</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f7f7f5;color:#1d2427;margin:0;min-height:100vh;display:grid;place-items:center}.panel{width:min(440px,calc(100% - 48px));background:white;border:1px solid #e5e5e2;border-radius:16px;padding:28px;box-shadow:0 10px 40px #00000008}h1{font-size:1.55rem;margin:0 0 8px}#counter{color:#697178;font-size:.9rem;margin-bottom:22px}ol{padding-left:28px;columns:2;line-height:2.65;font-size:1.08rem}button{width:100%;border:0;border-radius:10px;background:#263f49;color:white;font-size:1rem;padding:15px;cursor:pointer;margin-top:16px}button:disabled{opacity:.4}#status{font-size:.85rem;color:#697178;margin-top:14px}</style></head>
<body><main class="panel"><h1>25 Words or Less</h1><div id="counter">Loading lists…</div><ol id="words"></ol><button id="next" disabled>Next list →</button><div id="status"></div></main>
<script>
const URL='https://psoncybkfsdmjksyrcvv.supabase.co',KEY='sb_publishable_z-Aumyx5v_WMPTbY77u88A_H3oEEzFH',storageKey='25words-progress-v1';let lists=[],index=0;
const counter=document.getElementById('counter'),words=document.getElementById('words'),next=document.getElementById('next'),status=document.getElementById('status');
function render(){if(index>=lists.length){counter.textContent='All lists completed';words.replaceChildren();next.disabled=true;status.textContent='You have finished all available lists.';return}const list=lists[index];counter.textContent='List '+(index+1)+' of '+lists.length;words.replaceChildren(...list.words.map(w=>{const li=document.createElement('li');li.textContent=w;return li}));next.disabled=false;next.textContent=index===lists.length-1?'Finish':'Next list →';status.textContent=''}
next.onclick=()=>{index++;localStorage.setItem(storageKey,String(index));render()};
(async()=>{try{const res=await fetch(URL+'/rest/v1/twentyfive_word_lists?select=id,sequence,words&order=sequence.asc',{headers:{apikey:KEY}});if(!res.ok)throw Error('Database error '+res.status);lists=await res.json();if(!lists.length)throw Error('No word lists loaded.');index=Math.min(Math.max(0,Number(localStorage.getItem(storageKey))||0),lists.length);render()}catch(e){counter.textContent='Unable to load lists';status.textContent=e.message}})();
</script></body></html>
