<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>25 Words or Less</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f7f5;
      color: #1d2427;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .panel {
      width: min(440px, calc(100% - 48px));
      background: #fff;
      border: 1px solid #e5e5e2;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 40px #00000008;
    }
    .header { display: flex; align-items: center; justify-content: space-between; position: relative; gap: 12px; }
    h1 { font-size: 1.55rem; line-height: 1.2; margin: 0; }
    #counter { color: #697178; font-size: .9rem; margin: 8px 0 22px; }
    .word-stage { position: relative; min-height: 220px; }
    #words { margin: 0; padding-left: 28px; columns: 2; line-height: 2.65; font-size: 1.08rem; }
    .reveal-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px dashed #bcccd0;
      border-radius: 12px;
      background: #eef3f3;
      color: #263f49;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .reveal-cover .cover-icon { color: #68818b; font-size: 1.65rem; font-weight: 400; }
    .reveal-cover:hover { background: #e7efef; }
    .reveal-cover:focus-visible { outline: 3px solid #87afba; outline-offset: 3px; }
    #next { width: 100%; border: 0; border-radius: 10px; background: #263f49; color: #fff; font-size: 1rem; padding: 15px; cursor: pointer; margin-top: 16px; }
    button:disabled { opacity: .4; cursor: default; }
    #status { font-size: .85rem; color: #697178; margin-top: 14px; }
    #status:empty { display: none; }
    .menu-toggle {
      width: 44px;
      height: 44px;
      display: grid;
      place-content: center;
      gap: 5px;
      flex-shrink: 0;
      border: 1px solid #e5e8e8;
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
    }
    .menu-toggle span { display: block; width: 19px; height: 2px; border-radius: 2px; background: #263f49; }
    .menu-toggle:hover:not(:disabled) { background: #f5f7f7; }
    .menu-toggle:focus-visible, .list-choice:focus-visible, #next:focus-visible { outline: 3px solid #87afba; outline-offset: 2px; }
    .list-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 9px);
      z-index: 10;
      width: min(318px, calc(100vw - 80px));
      max-height: min(60vh, 440px);
      overflow-y: auto;
      padding: 16px;
      background: #fff;
      border: 1px solid #e2e6e6;
      border-radius: 12px;
      box-shadow: 0 14px 32px #00000021;
    }
    [hidden] { display: none !important; }
    .menu-title { font-size: .9rem; font-weight: 650; margin-bottom: 13px; }
    .list-options { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .list-choice {
      min-width: 0;
      min-height: 42px;
      background: #f3f5f5;
      color: #263f49;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
    }
    .list-choice:hover { background: #e6ebec; }
    .list-choice[aria-current="true"], .list-choice[aria-current="true"]:hover { background: #263f49; color: #fff; }
  </style>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="panel">
    <div class="header" id="header">
      <h1>25 Words or Less</h1>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Select a list" aria-controls="list-menu" aria-expanded="false" disabled>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <div id="list-menu" class="list-menu" hidden>
        <div class="menu-title">Choose a list</div>
        <div id="list-options" class="list-options" role="group" aria-label="Word lists"></div>
      </div>
    </div>
    <div id="counter">Loading lists…</div>
    <div class="word-stage">
      <ol id="words" hidden></ol>
      <button id="reveal-cover" class="reveal-cover" type="button" aria-controls="words" aria-label="Reveal this list" hidden>
        <span class="cover-icon" aria-hidden="true">◉</span>
        <span>Tap to reveal words</span>
      </button>
    </div>
    <button id="next" disabled>Next list →</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
