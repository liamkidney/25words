<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="25 Words">
  <link rel="manifest" href="./manifest.json?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=2">
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
  <title>25 Words or Less</title>
  <style>
    :root { color-scheme: light; background-color: #fff; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff;
      color: #1d2427;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      display: flex;
      justify-content: center;
    }
    /* Always give iOS a white, non-changing surface to sample for its opaque
       Home Screen status bar. Keep the entire top edge white in the webpage. */
    .status-bar-surface {
      position: fixed;
      inset: 0 0 auto;
      height: max(14px, env(safe-area-inset-top, 0px));
      background-color: #fff;
      z-index: 2;
      pointer-events: none;
    }
    /* The changing pastel gradients fade smoothly out of the white header.
       Mask the common parent so the existing crossfade still works normally. */
    .round-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom,
        transparent 0px,
        transparent calc(env(safe-area-inset-top, 0px) + 12px),
        #000 calc(env(safe-area-inset-top, 0px) + 190px));
      mask-image: linear-gradient(to bottom,
        transparent 0px,
        transparent calc(env(safe-area-inset-top, 0px) + 12px),
        #000 calc(env(safe-area-inset-top, 0px) + 190px));
    }
    .round-backdrop-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 850ms ease-in-out;
    }
    /* Full-height composition: compact header, flexible counter, floating list card. */
    .app-layout {
      position: relative;
      z-index: 1;
      width: min(100%, 440px);
      min-height: calc(100dvh - env(safe-area-inset-top, 0px));
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .tap-counter { position: relative; flex: 1 1 auto; min-height: 156px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #263f49; }
    .tap-count { width: 100%; flex: 1; display: grid; place-items: center; position: relative; border: 0; background: transparent; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .tap-number { font-size: clamp(5rem, 20vw, 7.5rem); line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums; }
    .tap-number.animate { animation: number-enter 260ms ease-out both; }
    .tap-ghost { position: absolute; font-size: clamp(5rem, 20vw, 7.5rem); line-height: 1; font-weight: 300; pointer-events: none; animation: number-float 320ms ease-out forwards; }
    .tap-controls { position: absolute; z-index: 2; left: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .tap-control { width: 44px; height: 44px; border: 1px solid #ffffff7c; border-radius: 12px; background: #ffffff54; color: #263f49; opacity: .82; display: grid; place-items: center; cursor: pointer; }
    .tap-control svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tap-control:disabled { opacity: .24; }
    .tap-control:focus-visible, .tap-count:focus-visible { outline: 3px solid #263f49; outline-offset: 2px; }
    @keyframes number-float { from { opacity: .7; transform: translateY(0); } to { opacity: 0; transform: translateY(-32px); } }
    @keyframes number-enter { from { opacity: .2; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .panel {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      width: auto;
      margin: 8px 16px 20px;
      padding: 24px 21px 18px;
      background: #fff;
      border: 1px solid #e6e9e8;
      border-radius: 26px;
      box-shadow: 0 12px 28px #3c59601c, 0 2px 4px #3c59600a;
    }
    /* Game controls are pressed and held; text selection and iOS callouts
       must not compete with touch or mouse gestures. */
    .panel, .panel * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .header { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 22px 0; }
    .header, .header * { -webkit-user-select: none; user-select: none; }
    h1 { font-size: 1.2rem; line-height: 1.2; letter-spacing: -.035em; font-weight: 730; margin: 0; color: #263f49; }
    h1 span { font-weight: 400; }
    .progress-row { display: flex; align-items: end; justify-content: space-between; gap: 12px; min-height: 57px; margin: 0 0 19px; }
    #pack-label { color: #829198; text-transform: uppercase; font-size: .68rem; font-weight: 720; letter-spacing: .09em; margin-bottom: 6px; }
    #counter { color: #263f49; font-size: 1.4rem; font-weight: 620; line-height: 1.2; letter-spacing: -.025em; }
    #viewed-indicator { font-size: .75rem; font-weight: 650; color: #51646d; background: #e7eded; border-radius: 20px; padding: 6px 11px; white-space: nowrap; margin-bottom: 2px; }
    /* Reserve the same space whether the list is hidden or revealed. */
    .word-stage { position: relative; height: clamp(220px, 31dvh, 265px); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #words {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 12px 13px 12px 32px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      grid-auto-flow: column;
      column-gap: 12px;
      align-items: stretch;
      line-height: 1.3;
      font-size: clamp(.79rem, 1.85dvh, 1rem);
      overflow: hidden;
      pointer-events: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #words li {
      min-width: 0;
      min-height: 0;
      align-content: center;
      overflow-wrap: anywhere;
      -webkit-user-select: none;
      user-select: none;
    }
    .reveal-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed #bcccd0;
      border-radius: 15px;
      background: #eef3f3;
      color: #263f49;
      font: inherit;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .reveal-cover:hover { background: #e7efef; }
    .reveal-cover:focus-visible { outline: 3px solid #87afba; outline-offset: 3px; }
    /* Keep the hit target active while held: hiding the button itself would lose pointerup. */
    .reveal-cover[data-revealing="true"],
    .reveal-cover[data-revealing="true"]:hover {
      background: transparent;
      border-color: transparent;
      color: transparent;
    }
    /* The advancing action is an unobtrusive circular icon inside the card. */
    .panel-footer { display: flex; justify-content: flex-end; padding-top: 14px; }
    #next {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #31505b, #1f3b45);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 5px 12px #29465129;
      cursor: pointer;
      transition: transform 130ms ease, box-shadow 130ms ease, filter 130ms ease;
    }
    #next:hover:not(:disabled) { filter: brightness(1.07); }
    #next:active:not(:disabled) { transform: scale(.95); box-shadow: 0 2px 7px #2946512b; }
    .next-arrow { display: grid; place-items: center; }
    .next-arrow svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    button:disabled { opacity: .4; cursor: default; }
    #status { font-size: .85rem; color: #697178; margin-top: 14px; }
    #status:empty { display: none; }
    .menu-toggle {
      width: 44px;
      height: 44px;
      display: grid;
      place-content: center;
      gap: 5px;
      flex-shrink: 0;
      border: 1px solid #263f4924;
      border-radius: 12px;
      background: #ffffff60;
      cursor: pointer;
    }
    .menu-toggle span { display: block; width: 19px; height: 2px; border-radius: 2px; background: #263f49; }
    .menu-toggle:hover:not(:disabled) { background: #f5f7f7; }
    .menu-toggle:focus-visible, .list-choice:focus-visible, #next:focus-visible { outline: 3px solid #87afba; outline-offset: 2px; }
    .list-menu {
      position: absolute;
      right: 22px;
      top: calc(100% + 9px);
      z-index: 10;
      width: min(318px, calc(100vw - 40px));
      max-height: min(60vh, 440px);
      overflow-y: auto;
      padding: 16px;
      background: #fff;
      border: 1px solid #e2e6e6;
      border-radius: 12px;
      box-shadow: 0 14px 32px #00000021;
    }
    [hidden] { display: none !important; }
    .menu-title { font-size: .9rem; font-weight: 650; margin-bottom: 13px; }
    .pack-options { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .pack-choice { border: 1px solid #dce3e3; border-radius: 8px; padding: 9px 12px; background: #f5f7f7; color: #263f49; cursor: pointer; font: inherit; font-size: .87rem; }
    .pack-choice[aria-current="true"] { border-color: #263f49; background: #263f49; color: white; }
    .pack-choice:focus-visible { outline: 3px solid #87afba; outline-offset: 2px; }
    .list-options { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .menu-summary { color: #708087; font-size: .75rem; margin: -5px 0 10px; }
    .menu-hint { color: #708087; font-size: .72rem; margin-top: 10px; }

    .list-choice {
      min-width: 0;
      min-height: 42px;
      background: #f3f5f5;
      color: #263f49;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
    }
    .list-choice[data-viewed="true"] { background: #e5e8e8; color: #8a9599; }
    .list-choice[data-viewed="true"]:hover { background: #d8dede; color: #52666e; }
    .list-choice:hover { background: #e6ebec; }
    .list-choice[aria-current="true"], .list-choice[aria-current="true"]:hover { background: #263f49; color: #fff; }
    @media (min-width: 600px) {
      .app-layout { max-height: 900px; min-height: min(100dvh, 900px); }
      .panel { margin-bottom: 24px; }
    }
    @media (max-height: 700px) {
      .tap-counter { min-height: 130px; }
      .panel { padding-top: 18px; padding-bottom: 14px; }
      .word-stage { height: 212px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .round-backdrop-layer { transition: none; }
      .tap-number.animate, .tap-ghost { animation: none; }
      #next { transition: none; }
    }
  </style>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="round-backdrop" aria-hidden="true">
    <div class="round-backdrop-layer" id="round-backdrop-a"></div>
    <div class="round-backdrop-layer" id="round-backdrop-b"></div>
  </div>
  <div class="status-bar-surface" aria-hidden="true"></div>
  <div class="app-layout">
    <header class="header" id="header">
      <h1>25 Words <span>or Less</span></h1>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Select a pack or list" aria-controls="list-menu" aria-expanded="false" disabled>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <div id="list-menu" class="list-menu" hidden>
        <div class="menu-title">Choose a pack</div>
        <div id="pack-options" class="pack-options" role="group" aria-label="Word packs"></div>
        <div class="menu-title">Choose a list</div>
        <div id="viewed-count" class="menu-summary" aria-live="polite"></div>
        <div id="list-options" class="list-options" role="group" aria-label="Word lists"></div>
        <div class="menu-hint">Shaded lists have been viewed and can be replayed.</div>
      </div>
    </header>
    <section class="tap-counter" aria-label="Tally counter">
      <button id="tap-count" class="tap-count" type="button" aria-label="Increase counter"><span id="tap-number" class="tap-number" aria-live="off">0</span></button>
      <div class="tap-controls">
        <button id="tap-undo" class="tap-control" type="button" aria-label="Subtract one" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button>
        <button id="tap-reset" class="tap-control" type="button" aria-label="Reset counter to zero" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.3 6"/><path d="M4 4v7h7"/></svg></button>
      </div>
    </section>
  <main class="panel">

    <div class="progress-row"><div class="progress-detail"><div id="pack-label"></div><div id="counter">Loading lists…</div></div><span id="viewed-indicator" hidden>Viewed</span></div>
    <div class="word-stage">
      <ol id="words" hidden></ol>
      <button id="reveal-cover" class="reveal-cover" type="button" aria-controls="words" aria-label="Press and hold to reveal words" aria-pressed="false" hidden></button>
    </div>
    <div class="panel-footer"><button id="next" type="button" disabled><span id="next-label" class="visually-hidden">Next list</span><span class="next-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span></button></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  </div>
</body>
</html>
